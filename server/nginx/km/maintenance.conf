# メンテナンス中の画面(2026-10-21、利用者の指示)。
#
# 公開・管理画面(443)と Logto の入口(auth.<ドメイン>)の server が include する。
# **転送先が居ないとき(nginx 自身が出す 502)**に、km/maintenance.html を 503 で返す。
# 504(待ち切れ)は含めない —— 地図の取り込みなど長い処理の待ち切れで「メンテナンス中」と出ると取り違える。
# 相手(PHP・Logto)が自分で返す 500・503 はそのまま通す(proxy_intercept_errors を付けないので、error_page は掛からない)。
# 回数の制限は 429(limit_req_status・limit_conn_status)なので、この画面にはならない。
# 作ったきっかけは、PHP の RCE(CVE-2026-109618 / 109619)で修正版を当てるまで web などを止めたこと
# (docs/05-containers.ipynb §10)。止めている間も入口(nginx)と証明書の更新(certbot)は動かしておく。
#
# **error_page を自分で持つ location には効かない**(nginx は error_page を 1 つでも書いた location では上を継承しない)。
# 今は taskmgr の 2 つだけ(管理者向けで、止めている間は素の 502 のままでよい)。
#
# 管理用のホストでは、この内部の URL を公開側へ飛ばさない($km_leave_admin_host の例外に __km_maintenance がある)。
# error_page の内部の移動は server の直下の if をもう一度通るため。
#
# 画面は外のものを何も読まない(CSS は中に書く・JS は無い)。CSP はここで決める。
# POST のまま移っても、nginx は error_page の先を GET として扱うので 405 にはならない。
error_page 502 =503 /__km_maintenance;

location = /__km_maintenance {
    internal;
    alias /etc/nginx/km/maintenance.html;
    default_type text/html;
    types { }
    charset utf-8;

    # ここで add_header を書くと server の add_header は継承されない(必要なものを全部書く)。
    # 503 にも付くよう always を付ける
    add_header Cache-Control "no-store" always;
    add_header Retry-After 600 always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    include /etc/nginx/km/hsts-*.conf;
}
