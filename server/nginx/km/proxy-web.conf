# 9443(Web アプリ)へ渡すときの共通設定。
#
# レート制限を掛ける入口(問い合わせフォーム・氏名の解除・管理画面のログイン)は
# location を分ける必要があり、そのたびにこの塊を書き写すと**どれか1つだけ古くなる**。
# 1本にまとめて include する。
#
# X-Real-IP は nginx が $remote_addr で必ず上書きするので、アプリ側はこれを信用してよい
# (X-Forwarded-For は利用者由来の値が先頭に残りうるので使わない)。

# km_web はテンプレートの upstream(名前を動いている間も引き直す。web を作り直しても 502 にならない)
proxy_pass http://km_web;
proxy_http_version 1.1;

proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

proxy_hide_header X-Powered-By;

# **proxy_read_timeout はここに書かない**(2026-09-14 に 300s を外した)。
#
# 以前はここで全部 300 秒にしていたので、止まった PHP に 5 分ずつ接続を握られた。
# 既定の 60 秒はテンプレートの http で決め、長く待つ口(/admin/downloads.php は 300 秒、
# 地図の取り込みと配信の /admin/map-sync.php・/admin/map-publish.php は 180 秒)だけ location で延ばす。
# ここに書き戻すと、その location で**同じ指示が 2 回**になり、nginx が "is duplicate" で起動しない。
