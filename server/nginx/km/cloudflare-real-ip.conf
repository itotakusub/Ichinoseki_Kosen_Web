# Cloudflare の中継(橙の名前)越しでも、本当の送り元を $remote_addr にする(2026-11-08。docs/17 §2)。
#
# default.conf.template の http の段で include する。**灰(DNS だけ)のうちは何も変わらない** ——
# 下の範囲から来た接続のときだけ CF-Connecting-IP を読むので、直に来た相手が CF-Connecting-IP を付けても無視される。
#
# これが効くと、$remote_addr・$binary_remote_addr が本当の送り元になるので、そのまま正しく働く:
#   - 回数の制限(limit_req・limit_conn)
#   - 管理画面・タスクマネージャーの IP の許可(allow-*.conf)
#   - X-Real-IP(proxy-web.conf が $remote_addr で上書きする。PHP の回数制限・管理の記録が読む)
#   - 訪問者の記録(km_visit の "ip")・アクセスログ
# 中継の元の IP が要るときは $realip_remote_addr(nginx が残す)。
#
# real_ip_recursive は既定の off のまま。CF-Connecting-IP は Cloudflare が 1 つだけ入れ直すので、たどる必要が無い。
#
# **範囲の正本は https://www.cloudflare.com/ips/(ips-v4・ips-v6)。** 2026-11-08 に読んだ値。
# Cloudflare は範囲を変えるとき前もって知らせる。ホストの host-geoblock.sh update(ALLOW_CLOUDFLARE=yes のとき毎月)が
# 取った一覧とこのファイルを見比べ、違えば注意を出す。そのときはここを直して配備する。

