# 管理系ポート(8281 / 3002 / 8025)で使う、Logto ログインのゲート。
#
# nginx の auth_request が**リクエストごとに**この内部 location を呼び、
# 9443 側の admin/api/gate.php が 204(通す)か 401(通さない)だけを返す。
# 本文は見ないので速い。
#
# **Cookie はポートを区別しない**ので、9443 で確立した Logto のセッションが
# 8281 / 3002 / 8025 でもそのまま使える。これが成り立たないとこの仕組みは動かないため、
# 実装時に実測で確かめている。
#
# **ただしホストは区別する。** ここを取り違えると詰む:
# `ssh -L 18281:localhost:8281` で入ると宛先が `localhost` になり、
# ito4.jp の Cookie は送られない → 401 → ログイン画面 → ログインしても
# Cookie が付くのは ito4.jp 側 → **永久にログイン画面を回る。**
# SSH 越しに入るときは **-D(SOCKS)** を使うこと(allow-admin.conf に手順がある)。
#
# 401 のときは 9443 のログイン画面へ送る。$km_app_url はテンプレート側の map で
# ${KM_APP_URL} から作ってある(include されるこのファイルは envsubst を通らないため)。

location = /__km_gate {
    internal;

    # km_web はテンプレートの upstream(proxy-web.conf と同じ)
    proxy_pass http://km_web/admin/api/gate.php;
    proxy_pass_request_body off;          # 判定に本文は要らない
    proxy_set_header Content-Length "";

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Original-URI $request_uri;
}

# 管理画面を別オリジンにしたときは管理用のホストのログイン画面へ(2026-09-15)。
# $km_admin_url はテンプレートの map で、別オリジンにしていなければ $km_app_url と同じ値
location @km_login {
    return 302 $km_admin_url/admin/login.php;
}

# **許可していない送信元には、何も返さずに接続を切る**(2026-09-17)。
#
# 以前は 1 枚目(allow-*.conf の deny all)が 403 のページを返していた。中身は出さなくても、
# 「このポートに管理用の何かがある」ことは伝わる。444 は nginx 独自の「応答を書かずに閉じる」。
# ブラウザには「応答がありません」(ERR_EMPTY_RESPONSE など)と出る。
#
# 隠せないもの: ポートが開いていること自体と、TLS の証明書(名前)は接続した時点で見える。
# そこまで隠すなら、ホストのファイアウォールで送信元を絞る(Docker の publish は ufw を素通りするので
# DOCKER-USER のチェーンに書く)。ここでは「管理用の画面があると名乗らない」までにしておく。
location @km_hide {
    return 444;
}
