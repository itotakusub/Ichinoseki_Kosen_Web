# 管理系ポート(8281 phpMyAdmin / 3002 Logto 管理 / 8025 Mailpit)へ入れる送信元。
#
# nginx は `include /etc/nginx/km/allow-*.conf;` でこれを読む。
#
# ---------------------------------------------------------------------------
# VPS(Linux)では、この IP 制限が**実際に効く**
# ---------------------------------------------------------------------------
# publish が iptables の DNAT なので、コンテナから見える送信元が本当の接続元になる。
# 校内 LAN の Windows ホスト(Docker Desktop)では自前のプロキシを挟むため
# **全員が 172.18.0.1 に見えていて、この制限は機能していなかった**。
# 同じ理由で、アプリ側の IP ごとのレート制限(問い合わせ・氏名の解除)も
# あちらでは1つのバケツを共有していたが、こちらでは利用者ごとに分かれる。
#
# ---------------------------------------------------------------------------
# 守りは2枚重ね。**これ1枚に頼らない**
# ---------------------------------------------------------------------------
#   1枚目(ここ)  … 送信元 IP の制限
#   2枚目          … Logto のログイン判定(auth_request → admin/api/gate.php)
#                     未ログインなら 302 で本体のログイン画面へ送る
#
# nginx の設定上、判定は **proxy_pass の手前**にある。つまり未ログインの相手には
# phpMyAdmin も Logto Console も Mailpit も**一切渡らない**。
#
# さらに Logto 側で MFA を Mandatory にしてあるので、パスワードだけでは通らない。
#
# ---------------------------------------------------------------------------
# 3001 と 6001 には掛けていない
# ---------------------------------------------------------------------------
# 3001 はログインそのものの入口で、塞ぐと誰もログインできない(ゲートの判定自体が
# Logto のセッションに依っているので鶏と卵になる)。6001 はブラウザが直接 WebSocket を
# 張る先で、購読の可否は本体側の chat-auth.php が署名で決めている。

# ---------------------------------------------------------------------------
# 個人の固定 IP はこのファイルに書かない
# ---------------------------------------------------------------------------
# 自宅などの固定 IP は `allow-admin-home.local.conf` へ置く。
# **リポジトリに個人の所在情報を残さない**ため(ここは配備物に含まれる)。
#
# nginx は `include /etc/nginx/km/allow-*.conf;` と**グロブ**で読むので、
# ファイルを足すだけで効く。仕組みは変えていない。
#
# **並び順に意味がある。** 下の `deny all;` より後ろに書いた `allow` は効かない。
# グロブは辞書順で読まれ、`-`(0x2D)は `.`(0x2E)より小さいので
# `allow-admin-home.local.conf` はこのファイルより**前**に来る。名前を変えないこと。
#
# **無くても締め出されない。** 下の SSH トンネル用の許可が退路として残る。

# ---------------------------------------------------------------------------
# SSH 越しに入るときは **-D(SOCKS)を使う。-L(ポート転送)では通れない**
# ---------------------------------------------------------------------------
#
#   ssh -D 1080 km@ito4.jp
#   → ブラウザの SOCKS5 プロキシを localhost:1080 に(**DNS もプロキシ側で引く**)
#   → そのまま https://ito4.jp:8281 / :3002 / :8025 を開く
#
# **なぜ -L では駄目なのか。**
#
# `ssh -L 18281:localhost:8281` で入ると、ブラウザから見た宛先は
# `https://localhost:18281` になる。IP 制限(このファイル)は通るが、
# **その先の Logto ゲートで必ず弾かれる。**
#
#   Cookie は**ポートを区別しないがホストは区別する。**
#   ito4.jp で確立したセッションの Cookie は localhost へは送られない。
#   → gate.php はセッション無しと判断して 401
#   → nginx が ito4.jp のログイン画面へ 302
#   → そこでログインしても Cookie が付くのは ito4.jp 側
#   → localhost:18281 へ戻ると、また未ログイン。**永久にログイン画面を回る**
#
# gate-location.conf に「Cookie はポートを区別しない」と書いてあるのは本当だが、
# **ホストが変わる場合の話が抜けていた。** -L はホストを変えてしまう。
#
# -D(SOCKS)なら**ホスト名がそのまま**なので Cookie が効き、証明書も一致する。
# 通信だけがサーバー経由になる。

# **トンネル用の許可。消さないこと。** 回線が変わって固定 IP が外れたときの
# **唯一の逃げ道**がこれ(-D の SOCKS。上の手順)。
#
#   127.0.0.1     … ホスト上から直接
#   163.43.218.158 … **-D のとき。** サーバーが自分の公開 IP へ繋ぎ直す形になり、
#                    コンテナからは元の送信元がそのまま見える(172.x にはならない)。
#                    **自分自身の住所**なので、これを許しても外から名乗ることはできない
#                    (TCP が成立しない)。**ホストを移したら書き換えること。**
#
# **`172.16.0.0/12` は外した**(2026-09-15。security-review-2026-09-14 §7 の 8)。
# -L のトンネル用に Docker のゲートウェイを許していたが、同じ範囲に**全コンテナ**が居る ——
# 破られたコンテナ(web など)から 172.x として 1 枚目を素通りできた。-L は上のとおり Logto の
# ゲートで必ず弾かれる経路で、実際に使える逃げ道は -D だけだった。自分の IP は
# allow-admin-home.local.conf(配備物に含めない)に書く。
allow 127.0.0.1;
allow ::1;
allow 163.43.218.158;

deny all;
