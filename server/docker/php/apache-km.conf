# Apache の追加設定(2026-09-14 の診断で追加)。
#
# compose が /etc/apache2/conf-enabled/km.conf へ直接マウントする(compose.yaml と
# compose.vps.yaml の web の volumes の**両方**に書いてある。VPS 側は `!override` なので片方だけだと効かない)。
# apache2.conf は末尾で conf-enabled/*.conf を読むので、ここに書いた値が先頭の既定に勝つ。

# ---------------------------------------------------------------------------
# PATH_INFO を受け付けない
# ---------------------------------------------------------------------------
# mod_php は既定で `/contact.php/x` のような URL でも contact.php を実行する。
# 一方 nginx の守りは完全一致(`location = /contact.php`)や `\.php$` で書いてあるので、
# **後ろに `/x` を足すだけで、入口の回数制限と include 専用ファイルの 404 を素通りできた。**
# 本番で `/contact.php/x` と `/logto-client.php/x` が 200 を返し、`/admin/index.php/a.css` には
# 静的資材用の 30 日キャッシュの指定まで付いた(2026-09-14 に実測)。
#
# このサイトは PATH_INFO を使っていない(src を grep して 0 件)。付いていたら 404 にする。
# nginx 側でも `.php/` を 404 にしてある —— こちらはその内側の2枚目。
# **片方だけにしない。** nginx を通らない経路(コンテナ内からの curl など)と、nginx の並び順の誤りの両方に備える。
AcceptPathInfo Off

# ---------------------------------------------------------------------------
# 1 回の読み書きを待つ時間
# ---------------------------------------------------------------------------
# イメージ既定の Timeout は 300 秒(本番で実測)。本文を少しずつしか送らない相手に、
# ワーカー(MaxRequestWorkers 150)を 5 分ずつ握られる。前段の nginx が client_body_timeout 30s と
# proxy_read_timeout 60s で先に切るので、Apache がそれより長く待つ理由が無い。
#
# **読み書き1回ごとの待ち時間であって、処理の総時間ではない。** APK の受信や PHP の長い処理は、
# 進んでいる限りこれでは切れない。
Timeout 60

# ---------------------------------------------------------------------------
# 同時に動かす PHP の数(prefork のワーカー)
# ---------------------------------------------------------------------------
# イメージ既定は MaxRequestWorkers 150(本番で実測)。一方 compose は web に mem_limit 384m を付けた。
# ワーカーは1本あたり待機で 10〜20MB、重い処理では memory_limit(128M)まで膨らむので、
# **150 本を許すと、上限に当たった瞬間にコンテナの中で OOM が起きる**(= 全部の要求が落ちる)。
# 意図的に遅い要求を並べる相手にも、150 本ぶんのメモリを差し出すことになる。
#
# 30 本にする。溢れた接続は Apache の待ち行列(ListenBacklog)で順番を待つだけで、断られない。
# 前段の nginx が IP ごとの limit_conn と limit_req で先に絞っているので、正規の利用ではまず溢れない。
# docker stats で web が 384m に張り付かず、かつ応答が遅いと感じるなら、mem_limit と一緒に上げる。
MaxRequestWorkers 30
