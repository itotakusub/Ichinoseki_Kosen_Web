; エラーの扱い(1.0.0 のセキュリティ確認で追加)。
;
; このコンテナは php.ini を1つも読んでいなかったため、PHP の組み込み既定
; (display_errors=1 / log_errors=0)のまま動いていた。実測すると:
;
;   GET /api/download.php?slug[]=x
;   → 本文に「Warning: Array to string conversion in /var/www/html/api/download.php on line 28」
;
; つまり **サーバーの絶対パスと行番号が利用者に見えていた**。
; さらに悪いことに、警告が先に出力されるとヘッダーを送れなくなるため、
; その後の http_response_code(404) が効かず **200 が返っていた**。
; 情報が漏れるだけでなく、動作そのものが壊れる。

; 画面には出さない。
display_errors = Off
display_startup_errors = Off

; 代わりに必ずログへ出す。出力先は指定しない = SAPI のログ(Apache のエラーログ)へ流れ、
; docker logs km-php-apache で読める。
log_errors = On
error_reporting = E_ALL

; X-Powered-By を出さない。nginx 側でも proxy_hide_header で消しているが、
; 発生源で止めておく(nginx を経由しない経路が将来できても漏れない)。
expose_php = Off
