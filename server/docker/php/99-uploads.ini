; アップロードの上限。
;
; 既定は upload_max_filesize=2M / post_max_size=8M で、管理画面から差し替える配布用の APK
; (数十MB)がまったく通らなかった。lib/distributables.php 側の上限(APK 200MB)と、
; nginx の client_max_body_size 210m に合わせてある。
;
; post_max_size は upload_max_filesize より大きくしておく必要がある
; (ファイル本体に加えてフォームの他の項目も同じ本文に乗るため)。
upload_max_filesize = 200M
post_max_size = 210M

; 大きいファイルの受信と保存に時間がかかるぶんの余裕。
max_input_time = 300
