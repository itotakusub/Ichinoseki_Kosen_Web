; 実行時間・外への待ち時間・セッションの受け付け方(2026-09-14 の診断で追加)。
;
; このコンテナは php.ini を1つも読まない(99-errors.ini を参照)ので、ここに書かない値は
; PHP の組み込み既定になる。**意図して決めたい値だけ**を書いて固定する。
;
; memory_limit はここでは変えない。上げると、web コンテナの上限(compose.yaml の mem_limit 384m)を
; 少ない同時リクエストで使い切るようになる。

; 1 リクエストの実行時間の上限。組み込み既定と同じ 30 秒だが、**書いて固定する**。
; Linux では待ち(DB・ネットワーク・readfile の書き出し)の時間は数えないので、APK の配信は止まらない。
; 地図の取り込みのような本当に長い管理処理は、PHP 側で set_time_limit() を明示すること
; (nginx の proxy_read_timeout も既定 60 秒なので、それを超えるものは nginx 側にも例外が要る)。
max_execution_time = 30

; ストリーム(file_get_contents など)の読み待ちの既定。組み込み既定は 60 秒。
; 外の相手が応答しないと、その間 Apache のワーカーを1つ握り続ける。
; **相手が遅いときに巻き添えで詰まらない**よう 15 秒にする。
; PDO(mysqlnd)の接続待ちも、ATTR_TIMEOUT を渡さないときはこの値になる。
; curl(Logto・Management API)は自分のタイムアウトを使うので、ここの値は効かない。
default_socket_timeout = 15

; セッション ID の受け付け方。lib/session.php でも ini_set する(二重でよい)。
; lib を通さずに session_start() する経路が将来できても効くよう、発生源でも決めておく。
;   use_strict_mode  … サーバーが発行していない ID を受け付けない(セッション固定の対策)。組み込み既定は 0
;   use_only_cookies … URL の ?PHPSESSID= を読まない(組み込み既定も 1。明示)
;   use_trans_sid    … URL に ID を書き足さない(組み込み既定も 0。明示)
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
; Cookie の名前に __Host- を付ける(2026-09-15)。lib/session.php の KM_SESSION_NAME と同じ値にすること。
; __Host- は「Secure・Path=/・Domain なし」でないとブラウザが受け取らない。属性は lib/session.php が出す
session.name = __Host-KMSID

; セッションを残す長さ(秒)。lib/session.php の KM_SESSION_LIFETIME_SECONDS と同じ値にすること(2026-10-25)。
; 組み込み既定の 1440 秒(24 分)では、地図を 24 分以上開いたままにした人のセッションが掃除で消え、
; Logto のサインインはまだ有効なのにログインが切れた(利用者の報告「posters.php へ行って戻ると切れているときがある」)。
; 掃除は置き場のセッション全部を見るので、ここと lib で値が違うと、短い側がほかの人のセッションまで消す
session.gc_maxlifetime = 43200

; セッションの置き場(session.save_path)は**ここでは決めない**(2026-10-29)。lib/session.php の km_session_save_path が、
; 名前付きのボリューム /var/lib/km-sessions が在って書けるときだけそこへ向ける(無ければ既定の /tmp のまま)。
; ここで決め打ちにすると、compose を作り直す前にこの ini だけ届いたとき、在らない置き場に書こうとして全員がログインできなくなる

; アップロードの進み具合をセッションに書く機能(組み込み既定は On)を切る(2026-10-21)。
; このサイトは使っていない(src を grep して 0 件)。PHP の RCE(CVE-2026-109618 / 109619)の暫定策として
; 報道が挙げたもので、**これだけで防げる保証は無い**(本当の対策は PHP の修正版。docs/05-containers.ipynb)。
; 使っていないので、修正版を当てた後も残す
session.upload_progress.enabled = 0
